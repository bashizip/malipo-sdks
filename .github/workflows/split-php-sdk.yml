name: Split PHP SDK

on:
  push:
    branches:
      - main
    tags:
      - 'php-v*'

jobs:
  split-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Monorepo Split to Read-Only Repo
        uses: danharrin/monorepo-split-github-action@v2.3.0
        with:
          package_directory: 'malipo-php'
          repository_organization: 'bashizip'
          repository_name: 'malipo-php'
          target_branch: 'main'
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          branch: main
          commit_message: "chore: sync malipo-php subtree"
        env:
          GITHUB_TOKEN: ${{ secrets.PHP_SPLIT_PAT }}

      - name: Split Tag
        if: startsWith(github.ref, 'refs/tags/php-v')
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/php-}
          git tag $TAG_NAME
          git push https://${{ secrets.PHP_SPLIT_PAT }}@github.com/bashizip/malipo-php.git $TAG_NAME
