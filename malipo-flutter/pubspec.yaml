name: malipo
description: Official Flutter/Dart SDK for the Malipo Payment Gateway. Securely accept Mobile Money payments (Vodacom MPesa, Orange Money, Airtel Money) in the DRC.
version: 1.1.3
homepage: https://docs.malipo.dev/sdk/flutter/
# No `repository` or `issue_tracker` field on purpose: the SDK source lives in the private
# monorepo bashizip/malipo-sdks, so linking to it 404s for every pub.dev visitor. Add them
# once a public mirror exists (the PHP SDK has one at bashizip/malipo-php).

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  crypto: ^3.0.3
  http: ^1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
