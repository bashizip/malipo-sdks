name: malipo
description: Official Flutter/Dart SDK for the Malipo Payment Gateway. Securely accept Mobile Money payments (Vodacom MPesa, Orange Money, Airtel Money) in the DRC.
version: 1.1.0
homepage: https://github.com/malipo/malipo-flutter
repository: https://github.com/malipo/malipo-flutter
issue_tracker: https://github.com/malipo/malipo-flutter/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  crypto: ^3.0.3
  http: ^1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
