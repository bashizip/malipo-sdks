name: malipo
description: Official Flutter/Dart SDK for the Malipo Payment Gateway. Securely accept Mobile Money payments (Vodacom MPesa, Orange Money, Airtel Money) in the DRC.
version: 1.1.3
homepage: https://docs.malipo.dev/sdk/flutter/
# This SDK lives in the malipo-flutter/ subdirectory of the monorepo below.
repository: https://github.com/bashizip/malipo-sdks
issue_tracker: https://github.com/bashizip/malipo-sdks/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  crypto: ^3.0.3
  http: ^1.1.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.26.3
